  - nvidia
dependencies:
  - python=3.11
  - mamba
  - uv
  - cmake
  - ninja
  - gcc_linux-64
  - gxx_linux-64
  - openblas
  - cuda-version=12
  - cuda-nvcc
  - cuda-cudart-dev
  - libcublas-dev
  - libcusparse-dev
  - libcurand-dev
  - cuda-nvrtc-dev
